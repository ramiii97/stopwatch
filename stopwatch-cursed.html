<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저주 봉인 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@400;700;900&family=Zen+Antique&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #07060b;
    --ink: #e9e4f2;
    --dim: #8a8199;
    --curse: #7b4dff;
    --curse-2: #3fa9ff;
    --blood: #d11a3a;
    --paper: #e9dcb0;
    --paper-ink: #9c1426;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--void); color: var(--ink);
    font-family: "Noto Serif KR", serif; overflow-x: hidden;
    display: flex; justify-content: center; padding: 48px 16px 80px;
  }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.75));
  }
  .wrap { width: 100%; max-width: 420px; position: relative; z-index: 2; }

  .head { text-align: center; margin-bottom: 22px; }
  .head .kanji {
    font-family: "Zen Antique", serif; font-size: 15px; letter-spacing: 10px; color: var(--blood);
  }
  .head h1 {
    font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 40px; margin: 4px 0 0;
    letter-spacing: 2px; text-shadow: 0 0 18px rgba(123,77,255,.6);
  }
  .head .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }

  /* 결계 */
  .barrier {
    position: relative; padding: 34px 16px 26px; text-align: center;
    border: 1px solid rgba(123,77,255,.35);
    background: linear-gradient(180deg, rgba(20,14,36,.85), rgba(8,6,14,.9));
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
    box-shadow: inset 0 0 60px rgba(123,77,255,.18);
  }
  .barrier::before {
    content: "封"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-family: "Zen Antique", serif; font-size: 220px; color: rgba(209,26,58,.07); line-height: 1;
    pointer-events: none;
  }
  .grade {
    position: absolute; top: 10px; left: 16px; font-family: "Black Han Sans"; font-size: 13px;
    color: var(--blood); border: 1px solid var(--blood); padding: 2px 8px; letter-spacing: 1px;
  }
  .grade.r { left: auto; right: 16px; color: var(--curse-2); border-color: var(--curse-2); }
  .time {
    position: relative; font-family: "Black Han Sans", sans-serif;
    font-size: clamp(58px, 18vw, 84px); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 6px rgba(255,255,255,.5), 0 0 22px var(--curse), 0 0 44px rgba(63,169,255,.5);
  }
  .time .cs { font-size: .5em; color: var(--curse-2); }
  body.active .time { animation: flicker 3.2s infinite; }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; transform: none; }
    93% { opacity: .6; transform: translateX(2px) skewX(-4deg); }
    95% { opacity: 1; transform: translateX(-2px); }
  }
  .status {
    position: relative; margin-top: 14px; min-height: 22px; font-size: 15px; color: var(--dim);
  }
  .status b { color: var(--blood); }

  /* 캐릭터 이미지 */
  .duo { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  .portrait {
    position: relative; aspect-ratio: 3 / 4; overflow: hidden; cursor: pointer;
    background: #0e0a18; border: 1px solid; border-radius: 2px; transition: transform .2s;
  }
  .portrait:hover { transform: translateY(-3px); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .portrait.has img { display: block; }
  .portrait .ph {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--dim); font-size: 12px; text-align: center; padding: 10px; line-height: 1.5;
  }
  .portrait .ph .k { font-family: "Zen Antique", serif; font-size: 56px; line-height: 1; }
  .portrait.has .ph { display: none; }
  .portrait .name {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 8px; text-align: center;
    background: linear-gradient(transparent, rgba(0,0,0,.9)); font-family: "Black Han Sans"; font-size: 17px; letter-spacing: 1px;
  }
  .p-blue { border-color: var(--curse-2); box-shadow: 0 0 18px rgba(63,169,255,.35); }
  .p-blue .ph .k { color: var(--curse-2); }
  .p-red { border-color: var(--blood); box-shadow: 0 0 18px rgba(209,26,58,.35); }
  .p-red .ph .k { color: var(--blood); }
  body.active .p-red { animation: pulseR 1.6s ease-in-out infinite; }
  body.sealing .p-blue { animation: pulseB .9s ease-in-out infinite; }
  @keyframes pulseR { 50% { box-shadow: 0 0 38px rgba(209,26,58,.85); } }
  @keyframes pulseB { 50% { box-shadow: 0 0 38px rgba(63,169,255,.95); } }
  .vs {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); z-index: 3;
    font-family: "Black Han Sans"; font-size: 30px; color: #fff; pointer-events: none;
    text-shadow: 0 0 12px var(--curse), 0 0 24px var(--blood);
  }

  /* 버튼 = 부적 */
  .controls { display: flex; justify-content: center; gap: 22px; margin: 34px 0 10px; min-height: 140px; }
  .tali {
    width: 86px; height: 136px; border: none; cursor: pointer; position: relative;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0 2px, transparent 2px 5px),
      var(--paper);
    color: var(--paper-ink); box-shadow: 0 6px 22px rgba(0,0,0,.6), 0 0 18px rgba(123,77,255,.25);
    font-family: "Zen Antique", serif; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; padding: 10px 6px;
    transition: transform .15s, left .22s cubic-bezier(.3,1.6,.5,1), top .22s cubic-bezier(.3,1.6,.5,1);
  }
  .tali::before {
    content: ""; position: absolute; inset: 5px; border: 1.5px solid var(--paper-ink); pointer-events: none;
  }
  .tali .big { font-size: 38px; line-height: 1; }
  .tali .lbl { font-family: "Black Han Sans"; font-size: 15px; letter-spacing: 1px; }
  .tali:hover { transform: rotate(-2deg) translateY(-3px); }
  .tali:active { transform: scale(.95); }
  .tali.start { box-shadow: 0 6px 22px rgba(0,0,0,.6), 0 0 26px rgba(63,169,255,.5); }
  .tali.stop { box-shadow: 0 6px 22px rgba(0,0,0,.6), 0 0 26px rgba(209,26,58,.6); }
  .tali.stop.fleeing { position: fixed; z-index: 50; }
  .tali.stop.tired { animation: shake .25s infinite; }
  @keyframes shake { 50% { transform: translateX(-2px) rotate(-2deg); } }

  /* 랩 */
  .laps { margin-top: 26px; display: flex; flex-direction: column; gap: 8px; }
  .rec {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
    background: rgba(20,14,36,.75); border-left: 3px solid var(--curse);
    font-variant-numeric: tabular-nums; animation: slash .3s ease-out;
  }
  .rec .n { color: var(--dim); font-size: 14px; }
  .rec .t { font-family: "Black Han Sans"; font-size: 22px; }
  .rec .g { font-family: "Black Han Sans"; font-size: 12px; padding: 2px 6px; margin-left: 8px; }
  .rec.best { border-color: var(--curse-2); }
  .rec.best .g { color: var(--curse-2); border: 1px solid var(--curse-2); }
  .rec.worst { border-color: var(--blood); }
  .rec.worst .g { color: var(--blood); border: 1px solid var(--blood); }
  @keyframes slash { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  .hint { text-align: center; color: var(--dim); font-size: 13px; margin-top: 28px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 100;
    background: #0e0a18; border: 1px solid var(--blood); padding: 10px 18px; font-size: 16px;
    font-family: "Black Han Sans"; letter-spacing: .5px; opacity: 0; transition: .2s; pointer-events: none;
    white-space: nowrap; max-width: calc(100vw - 32px); box-shadow: 0 0 20px rgba(209,26,58,.4);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 대사 연출 */
  .flash {
    position: fixed; inset: 0; z-index: 90; pointer-events: none; display: flex; align-items: center;
    justify-content: center; opacity: 0; background: radial-gradient(circle, rgba(123,77,255,.35), rgba(0,0,0,.85));
  }
  .flash.show { animation: flash 1.4s ease-out; }
  .flash span {
    font-family: "Black Han Sans"; font-size: clamp(34px, 11vw, 64px); letter-spacing: 4px; color: #fff;
    text-shadow: 0 0 20px var(--curse), 0 0 40px var(--blood); text-align: center; padding: 0 16px;
  }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }

  /* 모달 */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 80;
  }
  .scrim.open { display: flex; }
  .modal {
    width: 100%; max-width: 340px; padding: 28px 22px 22px; text-align: center; position: relative;
    background: linear-gradient(180deg, #160f28, #0a0712); border: 1px solid rgba(209,26,58,.5);
    box-shadow: 0 0 40px rgba(209,26,58,.25); animation: pop .25s cubic-bezier(.3,1.6,.5,1);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .modal .mark { font-family: "Zen Antique"; color: var(--blood); font-size: 26px; }
  .modal h2 { font-family: "Black Han Sans"; font-weight: 400; font-size: 26px; margin: 6px 0 8px; }
  .modal p { margin: 0 0 20px; color: var(--dim); font-size: 14px; line-height: 1.6; }
  .choices { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .choices.swap { flex-direction: column-reverse; }
  .pill { border: none; cursor: pointer; font-family: "Black Han Sans"; transition: transform .12s; }
  .pill:active { transform: scale(.96); }
  .pill.big {
    width: 100%; font-size: 20px; padding: 14px; color: #fff; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--curse), var(--curse-2)); box-shadow: 0 0 20px rgba(123,77,255,.5);
  }
  .pill.tiny { background: none; color: var(--dim); font-family: "Noto Serif KR"; font-size: 12px; text-decoration: underline; padding: 4px; }

  .hold {
    position: relative; width: 100%; height: 60px; border: 1px solid var(--blood); background: #12091a;
    overflow: hidden; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: "Black Han Sans"; font-size: 19px; color: #fff; letter-spacing: 1px;
  }
  .hold .fill { position: absolute; inset: 0; width: 0%; background: linear-gradient(90deg, #5a0a1a, var(--blood)); }
  .hold span { position: relative; }
  .later { margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="head">
    <div class="kanji">呪 · 力 · 計 · 測</div>
    <h1>저주 봉인 타이머</h1>
    <div class="sub">한 번 풀린 저주는 쉽게 봉인되지 않는다</div>
  </div>

  <div class="duo">
    <div class="portrait p-blue" id="pBlue" title="클릭해서 이미지 바꾸기">
      <img alt="고죠 사토루">
      <div class="ph"><span class="k">蒼</span>이 폴더에 gojo.png를 넣거나<br>클릭해서 이미지 선택</div>
      <div class="name">고죠 사토루</div>
    </div>
    <div class="portrait p-red" id="pRed" title="클릭해서 이미지 바꾸기">
      <img alt="료멘 스쿠나">
      <div class="ph"><span class="k">呪</span>이 폴더에 sukuna.png를 넣거나<br>클릭해서 이미지 선택</div>
      <div class="name">료멘 스쿠나</div>
    </div>
    <div class="vs">VS</div>
  </div>
  <input type="file" accept="image/*" id="fBlue" hidden>
  <input type="file" accept="image/*" id="fRed" hidden>

  <div class="barrier">
    <span class="grade" id="gradeL">미등급</span>
    <span class="grade r">결계 展開</span>
    <div class="time" id="time">00:00<span class="cs">.00</span></div>
    <div class="status" id="status">부적을 떼어 저주를 해방하라</div>
  </div>

  <div class="controls" id="controls"></div>
  <div class="laps" id="laps"></div>
  <div class="hint">SPACE · 해방 &nbsp;/&nbsp; L · 기록</div>
</div>

<div class="toast" id="toast"></div>
<div class="flash" id="flash"><span id="flashTxt"></span></div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script>
  const $ = id => document.getElementById(id);
  const timeEl = $('time'), statusEl = $('status'), controls = $('controls'), lapsEl = $('laps'),
        toastEl = $('toast'), scrim = $('scrim'), modal = $('modal'), gradeL = $('gradeL');

  let running = false, startAt = 0, elapsed = 0, lastLap = 0, laps = [], raf = null;
  let dodges = 0, justDodged = false, tryingSince = null, noCount = 0;
  const MAX_DODGE = 6;

  const dodgeLines = ['봉인 부적이 회피했다', '주력이 부족하군', '그 정도 속도로는 못 잡는다', '…제법이군', '조금만 더 해봐라', '크윽… 붙잡혔다'];
  const runLines = ['저주가 퍼지고 있다…', '주력이 계속 흘러넘친다', '이 시간은 이제 내 것이다', '결계 안에서는 아무도 못 나간다', '봉인? 웃기는군'];

  const pad = n => String(n).padStart(2, '0');
  function fmt(ms) {
    const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60,
          s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
    return { main: (h ? h + ':' : '') + pad(m) + ':' + pad(s), cs: '.' + pad(cs) };
  }
  const now = () => running ? elapsed + performance.now() - startAt : elapsed;

  function grade(ms) {
    const m = ms / 60000;
    return m >= 30 ? '특급' : m >= 10 ? '1급' : m >= 3 ? '2급' : m >= 1 ? '3급' : ms > 0 ? '4급' : '미등급';
  }

  function tick() {
    const ms = now(), t = fmt(ms);
    timeEl.innerHTML = t.main + '<span class="cs">' + t.cs + '</span>';
    gradeL.textContent = grade(ms) + ' 저주';
    if (tryingSince !== null) {
      const sec = Math.floor((performance.now() - tryingSince) / 1000);
      statusEl.innerHTML = sec > 0 ? `봉인 시도 <b>${sec}초째</b>… 저주는 여전히 자라는 중` : '봉인하려는 건가? 하찮군';
    }
    if (running) raf = requestAnimationFrame(tick);
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }
  function flash(txt) {
    const f = $('flash'); $('flashTxt').innerHTML = txt;
    f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
  }

  function tali(cls, kanji, label, onClick) {
    const b = document.createElement('button');
    b.className = 'tali ' + cls;
    b.innerHTML = `<span class="big">${kanji}</span><span class="lbl">${label}</span>`;
    if (onClick) b.addEventListener('click', onClick);
    controls.appendChild(b);
    return b;
  }

  function renderControls() {
    controls.innerHTML = '';
    if (running) {
      tali('lap', '記', '기록', addLap);
      makeStop();
    } else {
      tali('start', '解', elapsed ? '재해방' : '해방', start);
      if (elapsed) tali('reset', '祓', '퇴마', reset);
    }
  }

  // ---- 도망치는 봉인 부적 ----
  function makeStop() {
    const b = tali('stop', '封', '봉인');
    const flee = e => {
      if (dodges >= MAX_DODGE) return;
      e.preventDefault();
      dodges++; justDodged = true;
      setTimeout(() => justDodged = false, 450);
      const w = 86, h = 136, m = 16;
      if (!b.classList.contains('fleeing')) {
        const r = b.getBoundingClientRect();
        b.style.left = r.left + 'px'; b.style.top = r.top + 'px';
        b.classList.add('fleeing'); void b.offsetWidth;
      }
      b.style.left = (m + Math.random() * (innerWidth - w - m * 2)) + 'px';
      b.style.top = (m + Math.random() * (innerHeight - h - m * 2)) + 'px';
      toast(dodgeLines[dodges - 1]);
      if (dodges >= MAX_DODGE) { b.classList.add('tired'); b.querySelector('.lbl').textContent = '헉…'; }
    };
    b.addEventListener('mouseenter', flee);
    b.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') flee(e); });
    b.addEventListener('click', () => { if (dodges >= MAX_DODGE && !justDodged) openAsk(); });
  }

  function start() {
    running = true; startAt = performance.now(); dodges = 0; noCount = 0;
    document.body.classList.add('active');
    flash(elapsed ? '저주 재해방' : '결계 전개');
    statusEl.textContent = runLines[Math.floor(Math.random() * runLines.length)];
    renderControls(); tick();
  }

  function reallyStop() {
    elapsed += performance.now() - startAt;
    running = false; cancelAnimationFrame(raf); tryingSince = null;
    document.body.classList.remove('active');
    closeModal();
    flash('봉 인');
    statusEl.textContent = '…쳇. 이번엔 봉인당해 주지.';
    renderControls(); tick();
  }

  function reset() {
    elapsed = 0; lastLap = 0; laps = []; lapsEl.innerHTML = '';
    statusEl.textContent = '퇴마 완료. 흔적도 남지 않았다';
    renderControls(); tick();
  }

  function addLap() {
    const total = now();
    laps.push(total - lastLap); lastLap = total;
    const min = Math.min(...laps), max = Math.max(...laps);
    lapsEl.innerHTML = '';
    laps.map((v, i) => ({ v, i })).reverse().forEach(({ v, i }) => {
      const t = fmt(v), d = document.createElement('div');
      let cls = '', g = '';
      if (laps.length > 1 && v === min) { cls = 'best'; g = '최속'; }
      else if (laps.length > 1 && v === max) { cls = 'worst'; g = '최둔'; }
      d.className = 'rec ' + cls;
      d.innerHTML = `<span class="n">제${i + 1} 기록${g ? `<span class="g">${g}</span>` : ''}</span><span class="t">${t.main}${t.cs}</span>`;
      lapsEl.appendChild(d);
    });
  }

  // ---- 확인 1: 진짜 봉인할 텐가 ----
  const asks = [
    ['정말 봉인할 텐가?', '지금 주력이 절정이다.<br>여기서 멈추면 후회할 거다.'],
    ['…다시 생각해라', '버튼 위치가 바뀐 건 저주의 영향이 아니다.<br>아마도.'],
    ['네 각오는 그 정도인가', '아직 돌이킬 수 있다.'],
  ];
  function openAsk() {
    tryingSince = tryingSince ?? performance.now();
    document.body.classList.add('sealing');
    scrim.classList.add('open'); renderAsk();
  }
  function renderAsk() {
    const [h, p] = asks[Math.min(noCount, asks.length - 1)];
    modal.innerHTML = `
      <div class="mark">呪</div><h2>${h}</h2><p>${p}</p>
      <div class="choices ${noCount % 2 ? 'swap' : ''}">
        <button class="pill big" id="keep">저주를 계속 풀어둔다</button>
        <button class="pill tiny" id="yes">봉인한다</button>
      </div>`;
    $('keep').onclick = keepGoing;
    $('yes').onclick = () => { noCount++; noCount < asks.length ? renderAsk() : renderHold(); };
  }

  // ---- 확인 2: 인을 맺어라 ----
  function renderHold() {
    modal.innerHTML = `
      <div class="mark">印</div><h2>최종 봉인 의식</h2>
      <p>3초간 인(印)을 유지하라.<br>손을 떼면 의식은 처음부터다.</p>
      <button class="hold" id="hold"><div class="fill" id="fill"></div><span id="holdTxt">꾹 눌러 인을 맺는다</span></button>
      <div class="later"><button class="pill tiny" id="keep">…역시 그만둔다</button></div>`;
    $('keep').onclick = keepGoing;
    const hold = $('hold'), fill = $('fill'), txt = $('holdTxt');
    const msgs = ['꾹 눌러 인을 맺는다', '주력 집중 중…', '저주가 저항한다…!', '버텨라!!', '봉인 직전—'];
    const DUR = 3000; let t0 = null, hr = null, fails = 0;
    const step = () => {
      const p = Math.min(1, (performance.now() - t0) / DUR);
      fill.style.width = (p * 100) + '%';
      txt.textContent = msgs[Math.min(msgs.length - 1, 1 + Math.floor(p * (msgs.length - 1)))];
      if (p >= 1) return reallyStop();
      hr = requestAnimationFrame(step);
    };
    hold.addEventListener('pointerdown', e => { e.preventDefault(); hold.setPointerCapture?.(e.pointerId); t0 = performance.now(); step(); });
    const up = () => {
      if (t0 === null) return;
      cancelAnimationFrame(hr); t0 = null; fill.style.width = '0%'; fails++;
      txt.textContent = fails > 2 ? '주력이 그것밖에 안 되나' : '의식 실패. 처음부터다';
    };
    hold.addEventListener('pointerup', up);
    hold.addEventListener('pointercancel', up);
    hold.addEventListener('contextmenu', e => e.preventDefault());
  }

  function keepGoing() {
    closeModal(); tryingSince = null; noCount = 0;
    statusEl.textContent = '현명하군. 저주는 계속된다';
    toast('저주가 만족스러워한다');
  }
  function closeModal() { scrim.classList.remove('open'); modal.innerHTML = ''; document.body.classList.remove('sealing'); }

  // ---- 캐릭터 이미지: 같은 폴더의 파일, 또는 클릭해서 고른 이미지 ----
  function setupPortrait(boxId, inputId, file, key) {
    const box = $(boxId), img = box.querySelector('img'), input = $(inputId);
    img.onload = () => box.classList.add('has');
    img.onerror = () => { box.classList.remove('has'); img.removeAttribute('src'); };
    let saved = null;
    try { saved = localStorage.getItem(key); } catch (e) {}
    img.src = saved || file;
    box.addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      const f = input.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        img.src = r.result;
        try { localStorage.setItem(key, r.result); }
        catch (e) { toast('이미지가 커서 새로고침하면 사라져요'); }
      };
      r.readAsDataURL(f);
    });
  }
  setupPortrait('pBlue', 'fBlue', 'gojo.png', 'cursed-img-blue');
  setupPortrait('pRed', 'fRed', 'sukuna.png', 'cursed-img-red');

  document.addEventListener('keydown', e => {
    if (scrim.classList.contains('open')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      running ? toast('키보드로는 봉인 못 한다') : start();
    } else if ((e.key === 'l' || e.key === 'L') && running) addLap();
  });

  // ---- 배경: 주력 입자 ----
  const cv = $('fx'), ctx = cv.getContext('2d');
  let W, H, parts = [];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', size); size();
  function spawn() {
    return { x: Math.random() * W, y: H + Math.random() * 40, r: (1 + Math.random() * 3) * devicePixelRatio,
             vy: -(0.3 + Math.random() * 0.8) * devicePixelRatio, vx: (Math.random() - .5) * .4,
             hue: Math.random() < .75 ? 260 : (Math.random() < .5 ? 205 : 350), life: 1 };
  }
  for (let i = 0; i < 60; i++) { const p = spawn(); p.y = Math.random() * H; parts.push(p); }
  function loop() {
    ctx.clearRect(0, 0, W, H);
    const boost = running ? 2.2 : 1;
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      p.y += p.vy * boost; p.x += p.vx + Math.sin(p.y / 60) * .3; p.life -= .0015 * boost;
      if (p.y < -20 || p.life <= 0) Object.assign(p, spawn());
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      g.addColorStop(0, `hsla(${p.hue},90%,65%,${.5 * p.life})`);
      g.addColorStop(1, `hsla(${p.hue},90%,50%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    if (!reduce) requestAnimationFrame(loop);
  }
  loop();

  renderControls();
</script>
</body>
</html>
