<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my little stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4eee4;
    --card: #fffdf8;
    --ink: #5b4a42;
    --soft: #a89488;
    --rose: #e6bcbc;
    --rose-deep: #c98f8f;
    --sage: #b5c0a5;
    --sage-deep: #8a9a7b;
    --butter: #f3e1a8;
    --tape: rgba(230, 200, 180, .7);
    --shadow: 0 10px 30px rgba(91, 74, 66, .12), 0 2px 6px rgba(91, 74, 66, .08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background-color: var(--paper);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .29  0 0 0 0 .25  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      radial-gradient(circle at 15% 10%, rgba(230,188,188,.35), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(181,192,165,.35), transparent 40%);
    color: var(--ink);
    font-family: "Gowun Batang", serif;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 56px 16px 80px;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 400px; position: relative; }

  .doodle { position: absolute; pointer-events: none; color: var(--rose-deep); opacity: .7; font-size: 22px; }
  .d1 { top: -26px; left: 6px; transform: rotate(-12deg); }
  .d2 { top: 40px; right: -6px; color: var(--sage-deep); transform: rotate(14deg); }
  .d3 { top: 300px; left: -10px; color: #d4b45c; font-size: 18px; }

  .head { text-align: center; margin-bottom: 18px; }
  .head .eyebrow {
    font-family: "Cormorant Garamond", serif; font-style: italic;
    letter-spacing: 3px; font-size: 14px; color: var(--soft);
  }
  .head h1 {
    font-family: "Gaegu", cursive; font-weight: 700; font-size: 34px; margin: 2px 0 0;
  }

  /* polaroid */
  .polaroid {
    position: relative; background: var(--card); padding: 18px 18px 22px;
    box-shadow: var(--shadow); transform: rotate(-1.5deg); border-radius: 3px;
  }
  .tape {
    position: absolute; width: 96px; height: 26px; background: var(--tape);
    top: -12px; left: 50%; transform: translateX(-50%) rotate(-3deg);
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    mask: linear-gradient(90deg, transparent 0 3px, #000 3px calc(100% - 3px), transparent 0);
  }
  .photo {
    background: linear-gradient(160deg, #efd9d4 0%, #f3e8dc 50%, #dfe5d3 100%);
    aspect-ratio: 1 / .8; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative; overflow: hidden;
  }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(91,74,66,.10));
  }
  .time {
    font-family: "Cormorant Garamond", serif; font-weight: 500;
    font-size: clamp(54px, 17vw, 76px); font-variant-numeric: tabular-nums; line-height: 1;
    letter-spacing: -1px; position: relative; z-index: 1;
  }
  .time .cs { font-size: .55em; color: var(--soft); }
  .status {
    font-family: "Gaegu", cursive; font-size: 19px; color: var(--rose-deep);
    margin-top: 10px; min-height: 24px; position: relative; z-index: 1; text-align: center; padding: 0 12px;
  }
  .caption {
    font-family: "Gaegu", cursive; font-size: 21px; text-align: center; margin-top: 14px;
  }

  /* buttons */
  .controls {
    display: flex; justify-content: center; gap: 22px; margin: 34px 0 10px; min-height: 92px;
  }
  .btn {
    width: 92px; height: 92px; border-radius: 50%; border: none; cursor: pointer;
    font-family: "Gaegu", cursive; font-weight: 700; font-size: 22px; color: var(--ink);
    box-shadow: var(--shadow); transition: transform .15s ease, left .25s cubic-bezier(.3,1.6,.5,1), top .25s cubic-bezier(.3,1.6,.5,1);
    position: relative;
  }
  .btn::before {
    content: ""; position: absolute; inset: 6px; border-radius: 50%;
    border: 1.5px dashed rgba(91,74,66,.25);
  }
  .btn:active { transform: scale(.94); }
  .btn.start { background: var(--sage); }
  .btn.lap { background: var(--butter); }
  .btn.reset { background: #e9dfd3; }
  .btn.stop { background: var(--rose); }
  .btn.stop.fleeing { position: fixed; z-index: 50; }
  .btn.stop.tired { animation: pant .5s ease-in-out infinite; }
  @keyframes pant { 50% { transform: scale(.95) rotate(-3deg); } }

  /* laps — sticky notes */
  .laps { margin-top: 26px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .note {
    background: #fbf3d9; padding: 12px 12px 14px; box-shadow: 0 4px 10px rgba(91,74,66,.1);
    font-family: "Gaegu", cursive; font-size: 18px; position: relative;
    animation: drop .35s cubic-bezier(.3,1.5,.5,1);
  }
  .note:nth-child(3n+1) { background: #f6e1e1; transform: rotate(-2deg); }
  .note:nth-child(3n+2) { background: #e6ecdc; transform: rotate(1.5deg); }
  .note:nth-child(3n)   { background: #fbf3d9; transform: rotate(-.5deg); }
  .note .n { color: var(--soft); font-size: 15px; }
  .note .t { font-family: "Cormorant Garamond", serif; font-size: 24px; font-variant-numeric: tabular-nums; }
  .note .tag { position: absolute; top: 6px; right: 8px; font-size: 14px; }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px) rotate(6deg); } }

  .hint { text-align: center; color: var(--soft); font-size: 13px; margin-top: 28px; font-family: "Gaegu", cursive; font-size: 16px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--card); padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow);
    font-family: "Gaegu", cursive; font-size: 19px; opacity: 0; transition: .25s; pointer-events: none;
    z-index: 100; white-space: nowrap; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* modal */
  .scrim {
    position: fixed; inset: 0; background: rgba(91,74,66,.25); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 80;
  }
  .scrim.open { display: flex; }
  .modal {
    background: var(--card); width: 100%; max-width: 340px; padding: 28px 22px 22px;
    border-radius: 6px; box-shadow: var(--shadow); text-align: center; position: relative;
    transform: rotate(1deg); animation: pop .3s cubic-bezier(.3,1.6,.5,1);
  }
  .modal .tape { top: -12px; }
  @keyframes pop { from { transform: scale(.85) rotate(-4deg); opacity: 0; } }
  .modal h2 { font-family: "Gaegu", cursive; font-size: 28px; margin: 4px 0 6px; }
  .modal p { margin: 0 0 20px; color: var(--soft); font-size: 15px; line-height: 1.5; }
  .choices { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .choices.swap { flex-direction: column-reverse; }
  .pill {
    border: none; cursor: pointer; font-family: "Gaegu", cursive; font-weight: 700;
    border-radius: 999px; color: var(--ink); transition: transform .12s;
  }
  .pill:active { transform: scale(.96); }
  .pill.big { background: var(--sage); font-size: 22px; padding: 14px 28px; width: 100%; }
  .pill.tiny { background: transparent; font-size: 13px; padding: 4px 8px; color: var(--soft); text-decoration: underline; }

  .hold {
    position: relative; width: 100%; height: 58px; border: none; border-radius: 999px;
    background: #f1e6dc; overflow: hidden; cursor: pointer; touch-action: none;
    font-family: "Gaegu", cursive; font-weight: 700; font-size: 20px; color: var(--ink);
    user-select: none; -webkit-user-select: none;
  }
  .hold .fill {
    position: absolute; inset: 0; width: 0%; background: var(--rose);
    transition: width .05s linear;
  }
  .hold span { position: relative; }
  .later { margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <span class="doodle d1">✿</span>
  <span class="doodle d2">☁︎</span>
  <span class="doodle d3">✦</span>

  <div class="head">
    <div class="eyebrow">— slow living, fast seconds —</div>
    <h1>오늘의 기록 ♡</h1>
  </div>

  <div class="polaroid">
    <div class="tape"></div>
    <div class="photo">
      <div class="time" id="time">00:00<span class="cs">.00</span></div>
      <div class="status" id="status">시작해볼까? ☕</div>
    </div>
    <div class="caption" id="caption">nov. 2026 · just breathe</div>
  </div>

  <div class="controls" id="controls"></div>

  <div class="laps" id="laps"></div>

  <div class="hint">space · 시작 &nbsp;/&nbsp; L · 랩</div>
</div>

<div class="toast" id="toast"></div>

<div class="scrim" id="scrim">
  <div class="modal" id="modal"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const timeEl = $('time'), statusEl = $('status'), controls = $('controls'),
        lapsEl = $('laps'), toastEl = $('toast'), scrim = $('scrim'), modal = $('modal');

  let running = false, startAt = 0, elapsed = 0, lastLap = 0, laps = [], raf = null;
  let dodges = 0, justDodged = false, tryingSince = null, noCount = 0;
  const MAX_DODGE = 6;

  const dodgeLines = ['어딜 감히 🫢', '잡아봐라~ 🎀', '느려 ㅋ', '오 좀 하는데?', '거의 다 왔는데~ 🌷', '헉헉... 잡혔다 😮‍💨'];
  const runningLines = ['지금 너무 잘하고 있어 ✨', '흐르는 시간도 예쁘다 🌿', '멈추지 마 제발 🥺', '오늘의 나 칭찬해 ♡', '시간아 천천히 가줘 ☁︎'];

  const pad = n => String(n).padStart(2, '0');
  function fmt(ms) {
    const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60,
          s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
    return { main: (h ? h + ':' : '') + pad(m) + ':' + pad(s), cs: '.' + pad(cs) };
  }
  const now = () => running ? elapsed + performance.now() - startAt : elapsed;

  function tick() {
    const t = fmt(now());
    timeEl.innerHTML = t.main + '<span class="cs">' + t.cs + '</span>';
    if (tryingSince !== null) {
      const sec = Math.floor((performance.now() - tryingSince) / 1000);
      statusEl.textContent = sec > 0 ? `멈추려고 한 지 ${sec}초째 ㅋ` : '어머 멈추게? 😗';
    }
    if (running) raf = requestAnimationFrame(tick);
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  function btn(cls, label, onClick) {
    const b = document.createElement('button');
    b.className = 'btn ' + cls; b.textContent = label;
    if (onClick) b.addEventListener('click', onClick);
    controls.appendChild(b);
    return b;
  }

  function renderControls() {
    controls.innerHTML = '';
    if (running) {
      btn('lap', '랩', addLap);
      makeStopButton();
    } else {
      btn('start', elapsed ? '계속' : '시작', start);
      if (elapsed) btn('reset', '지우기', reset);
    }
  }

  // ---- 도망가는 멈춤 버튼 ----
  function makeStopButton() {
    const b = btn('stop', '멈추기');
    const flee = e => {
      if (dodges >= MAX_DODGE) return;
      e.preventDefault();
      dodges++;
      justDodged = true;
      setTimeout(() => justDodged = false, 450);
      const size = 92, m = 16;
      if (!b.classList.contains('fleeing')) {
        const r = b.getBoundingClientRect();
        b.style.left = r.left + 'px'; b.style.top = r.top + 'px';
        b.classList.add('fleeing');
        b.offsetWidth; // reflow so the jump animates
      }
      b.style.left = (m + Math.random() * (innerWidth - size - m * 2)) + 'px';
      b.style.top = (m + Math.random() * (innerHeight - size - m * 2)) + 'px';
      toast(dodgeLines[dodges - 1]);
      if (dodges >= MAX_DODGE) { b.classList.add('tired'); b.textContent = '헉헉'; }
    };
    b.addEventListener('mouseenter', flee);
    b.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') flee(e); });
    b.addEventListener('click', () => {
      if (dodges < MAX_DODGE || justDodged) return;
      openAsk();
    });
  }

  function start() {
    running = true; startAt = performance.now();
    dodges = 0; noCount = 0;
    statusEl.textContent = runningLines[Math.floor(Math.random() * runningLines.length)];
    renderControls(); tick();
  }

  function reallyStop() {
    elapsed += performance.now() - startAt;
    running = false; cancelAnimationFrame(raf);
    tryingSince = null; closeModal();
    statusEl.textContent = '...알겠어. 멈췄어 😒';
    $('caption').textContent = '결국 멈췄구나 · 서운해';
    renderControls(); tick();
  }

  function reset() {
    elapsed = 0; lastLap = 0; laps = [];
    lapsEl.innerHTML = '';
    statusEl.textContent = '새로운 시작 ☕';
    $('caption').textContent = 'nov. 2026 · just breathe';
    renderControls(); tick();
  }

  function addLap() {
    const total = now();
    laps.push(total - lastLap); lastLap = total;
    const min = Math.min(...laps), max = Math.max(...laps);
    lapsEl.innerHTML = '';
    laps.map((v, i) => ({ v, i })).reverse().forEach(({ v, i }) => {
      const t = fmt(v), d = document.createElement('div');
      d.className = 'note';
      let tag = '';
      if (laps.length > 1 && v === min) tag = '🌷';
      else if (laps.length > 1 && v === max) tag = '🐌';
      d.innerHTML = `<span class="tag">${tag}</span><div class="n">lap ${i + 1}</div><div class="t">${t.main}${t.cs}</div>`;
      lapsEl.appendChild(d);
    });
  }

  // ---- 확인 모달 1: 진짜? ----
  const noLines = [
    ['진짜 멈출 거야? 🥺', '지금 흐름 너무 좋은데...<br>한 번만 더 생각해줘'],
    ['음... 다시 생각해봐 🫠', '버튼 위치 바뀐 거 아님<br>기분 탓임'],
    ['마음 바뀌었지? 그치? 🌸', '아직 늦지 않았어'],
  ];
  function openAsk() {
    tryingSince = tryingSince ?? performance.now();
    scrim.classList.add('open');
    renderAsk();
  }
  function renderAsk() {
    const [h, p] = noLines[Math.min(noCount, noLines.length - 1)];
    modal.innerHTML = `
      <div class="tape"></div>
      <h2>${h}</h2><p>${p}</p>
      <div class="choices ${noCount % 2 ? 'swap' : ''}">
        <button class="pill big" id="keep">아니 계속할래 💗</button>
        <button class="pill tiny" id="yes">응 멈출래</button>
      </div>`;
    $('keep').onclick = keepGoing;
    $('yes').onclick = () => {
      noCount++;
      if (noCount < noLines.length) renderAsk(); else renderHold();
    };
  }

  // ---- 확인 모달 2: 꾹 누르기 ----
  function renderHold() {
    modal.innerHTML = `
      <div class="tape"></div>
      <h2>마지막 관문 🔒</h2>
      <p>진심이면 3초 동안 꾹 눌러<br>손 떼면 처음부터야 ㅎ</p>
      <button class="hold" id="hold"><div class="fill" id="fill"></div><span id="holdTxt">꾹 눌러서 멈추기</span></button>
      <div class="later"><button class="pill tiny" id="keep">에이 그냥 계속할게</button></div>`;
    $('keep').onclick = keepGoing;

    const hold = $('hold'), fill = $('fill'), txt = $('holdTxt');
    const msgs = ['꾹 눌러서 멈추기', '아직이야~', '조금만 더...', '정말?? 😳', '진짜로???'];
    const DUR = 3000;
    let t0 = null, holdRaf = null, fails = 0;

    const step = () => {
      const p = Math.min(1, (performance.now() - t0) / DUR);
      fill.style.width = (p * 100) + '%';
      txt.textContent = msgs[Math.min(msgs.length - 1, 1 + Math.floor(p * (msgs.length - 1)))];
      if (p >= 1) return reallyStop();
      holdRaf = requestAnimationFrame(step);
    };
    const down = e => { e.preventDefault(); hold.setPointerCapture?.(e.pointerId); t0 = performance.now(); step(); };
    const up = () => {
      if (t0 === null) return;
      cancelAnimationFrame(holdRaf); t0 = null;
      fill.style.width = '0%'; fails++;
      txt.textContent = fails > 2 ? '손가락 힘 내 ㅋㅋ' : '놓쳤다 ㅋ 다시~';
    };
    hold.addEventListener('pointerdown', down);
    hold.addEventListener('pointerup', up);
    hold.addEventListener('pointercancel', up);
    hold.addEventListener('contextmenu', e => e.preventDefault());
  }

  function keepGoing() {
    closeModal();
    tryingSince = null; noCount = 0;
    statusEl.textContent = '역시 그럴 줄 알았어 😌✨';
    toast('현명한 선택이야 🌷');
  }
  function closeModal() { scrim.classList.remove('open'); modal.innerHTML = ''; }

  document.addEventListener('keydown', e => {
    if (scrim.classList.contains('open')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (running) toast('키보드 꼼수 안 통함 ㅎ 🙊'); else start();
    } else if ((e.key === 'l' || e.key === 'L') && running) addLap();
  });

  renderControls();
</script>
</body>
</html>
