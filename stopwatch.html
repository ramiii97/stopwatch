<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑워치</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #86868b;
    --line: #e5e5ea; --accent: #34c759; --danger: #ff3b30; --neutral: #8e8e93;
    --best: #0a84ff; --worst: #ff9f0a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d;
      --line: #2c2c2e; --neutral: #636366;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .display {
    font-variant-numeric: tabular-nums; font-size: clamp(48px, 16vw, 80px);
    font-weight: 200; text-align: center; letter-spacing: -1px; margin: 24px 0 40px;
  }
  .display .ms { color: var(--muted); }
  .controls { display: flex; justify-content: space-between; margin-bottom: 32px; }
  button {
    width: 88px; height: 88px; border-radius: 50%; border: none; cursor: pointer;
    font-size: 17px; font-weight: 500; color: #fff; transition: transform .08s, opacity .2s;
  }
  button:active { transform: scale(.94); }
  button:disabled { opacity: .4; cursor: default; }
  #startBtn { background: var(--accent); }
  #startBtn.running { background: var(--danger); }
  #lapBtn { background: var(--neutral); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li {
    display: flex; justify-content: space-between; padding: 14px 4px;
    border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 17px;
  }
  li.best { color: var(--best); }
  li.worst { color: var(--worst); }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="display" id="display">00:00<span class="ms">.00</span></div>
  <div class="controls">
    <button id="lapBtn" disabled>랩</button>
    <button id="startBtn">시작</button>
  </div>
  <ul id="laps"></ul>
  <div class="hint">Space: 시작/정지 · L: 랩 · R: 재설정</div>
</div>
<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapList = document.getElementById('laps');

  let running = false, startTime = 0, elapsed = 0, lastLapTotal = 0, raf = null;
  let laps = [];

  function format(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const pad = n => String(n).padStart(2, '0');
    return { main: (h ? h + ':' : '') + pad(m) + ':' + pad(s), ms: '.' + pad(cs) };
  }
  function now() { return running ? elapsed + (performance.now() - startTime) : elapsed; }

  function render() {
    const t = format(now());
    display.innerHTML = t.main + '<span class="ms">' + t.ms + '</span>';
    if (running) raf = requestAnimationFrame(render);
  }

  function renderLaps() {
    lapList.innerHTML = '';
    const min = laps.length > 1 ? Math.min(...laps) : null;
    const max = laps.length > 1 ? Math.max(...laps) : null;
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (laps[i] === min) li.className = 'best';
      else if (laps[i] === max) li.className = 'worst';
      const t = format(laps[i]);
      li.innerHTML = '<span>랩 ' + (i + 1) + '</span><span>' + t.main + t.ms + '</span>';
      lapList.appendChild(li);
    }
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      cancelAnimationFrame(raf);
      startBtn.textContent = '시작';
      startBtn.classList.remove('running');
      lapBtn.textContent = '재설정';
    } else {
      startTime = performance.now();
      running = true;
      startBtn.textContent = '정지';
      startBtn.classList.add('running');
      lapBtn.textContent = '랩';
      lapBtn.disabled = false;
      render();
    }
  }

  function lapOrReset() {
    if (running) {
      const total = now();
      laps.push(total - lastLapTotal);
      lastLapTotal = total;
      renderLaps();
    } else {
      reset();
    }
  }

  function reset() {
    if (running) return;
    elapsed = 0; lastLapTotal = 0; laps = [];
    lapBtn.textContent = '랩';
    lapBtn.disabled = true;
    renderLaps();
    render();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lapOrReset(); }
    else if (e.key === 'r' || e.key === 'R') { reset(); }
  });
</script>
</body>
</html>
