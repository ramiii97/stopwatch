<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゆっくり 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=Klee+One:wght@600&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --washi: #f6f1e7;
    --card: #fffcf5;
    --ink: #4a4039;
    --soft: #a3968a;
    --sakura: #f2c9cc;
    --sakura-deep: #d98f97;
    --matcha: #bccaa2;
    --matcha-deep: #7f9466;
    --ai: #4d5f7a;
    --kinari: #efe4cc;
    --shu: #c8483a;
    --shadow: 0 10px 28px rgba(74, 64, 57, .12), 0 2px 6px rgba(74, 64, 57, .07);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--ink); overflow-x: hidden;
    font-family: "Zen Maru Gothic", "Gowun Dodum", sans-serif;
    background-color: var(--washi);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.012 .35' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      radial-gradient(circle at 90% 5%, rgba(242,201,204,.45), transparent 35%),
      radial-gradient(circle at 5% 95%, rgba(188,202,162,.4), transparent 38%);
    display: flex; justify-content: center; padding: 52px 16px 80px;
  }
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal {
    position: absolute; top: -20px; width: 12px; height: 10px; background: var(--sakura);
    border-radius: 12px 1px 12px 1px; opacity: .85;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translate(0, 0) rotate(0); }
    100% { transform: translate(var(--drift), 110vh) rotate(540deg); }
  }

  .wrap { width: 100%; max-width: 400px; position: relative; z-index: 1; }

  .vert {
    position: absolute; top: 4px; right: -4px; writing-mode: vertical-rl;
    font-family: "Shippori Mincho", serif; font-size: 14px; letter-spacing: 6px; color: var(--soft);
  }
  .head { margin-bottom: 22px; padding-right: 28px; }
  .head .en { font-family: "Shippori Mincho", serif; font-size: 13px; letter-spacing: 4px; color: var(--sakura-deep); }
  .head h1 { font-family: "Klee One", "Gowun Dodum", cursive; font-size: 30px; margin: 4px 0 2px; font-weight: 600; }
  .head .sub { font-size: 13px; color: var(--soft); }

  /* 인스탁스 사진 */
  .photo-card {
    position: relative; background: var(--card); padding: 16px 16px 54px;
    box-shadow: var(--shadow); transform: rotate(-1.2deg); border-radius: 2px;
  }
  .tape {
    position: absolute; width: 90px; height: 24px; top: -11px; left: 22px; transform: rotate(-6deg);
    background: repeating-linear-gradient(45deg, rgba(217,143,151,.55) 0 6px, rgba(242,201,204,.55) 6px 12px);
  }
  .tape.r { left: auto; right: 22px; transform: rotate(5deg);
    background: repeating-linear-gradient(90deg, rgba(127,148,102,.45) 0 4px, rgba(188,202,162,.5) 4px 8px); }
  .photo {
    position: relative; aspect-ratio: 1 / .82; overflow: hidden;
    background:
      radial-gradient(circle at 75% 28%, #fbe6e0 0 14%, transparent 15%),
      linear-gradient(180deg, #f5d9d6 0%, #f1e2d2 55%, #d9e0c8 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .photo::before { /* 언덕 */
    content: ""; position: absolute; left: -10%; right: -10%; bottom: -30%; height: 55%;
    background: radial-gradient(ellipse at 30% 0%, rgba(188,202,162,.7), transparent 60%),
                radial-gradient(ellipse at 80% 10%, rgba(127,148,102,.35), transparent 55%);
  }
  .photo::after { /* 필름 질감 */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(74,64,57,.12));
  }
  .time {
    position: relative; z-index: 1; font-family: "Shippori Mincho", serif; font-weight: 500;
    font-size: clamp(54px, 17vw, 74px); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -1px;
  }
  .time .cs { font-size: .5em; color: var(--soft); }
  .status {
    position: relative; z-index: 1; margin-top: 12px; min-height: 22px; font-size: 15px;
    color: var(--sakura-deep); text-align: center; padding: 0 12px;
  }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    font-family: "Klee One", "Gowun Dodum", cursive; font-size: 18px;
  }
  .hanko {
    position: absolute; right: 14px; bottom: 10px; width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--shu); color: var(--shu); display: flex; align-items: center; justify-content: center;
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 20px; transform: rotate(-12deg); opacity: .85;
  }

  /* 버튼 */
  .controls { display: flex; justify-content: center; gap: 24px; margin: 34px 0 10px; min-height: 96px; }
  .btn {
    width: 92px; height: 92px; border-radius: 50%; border: none; cursor: pointer; position: relative;
    color: var(--ink); box-shadow: var(--shadow); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; font-family: inherit;
    transition: transform .15s, left .25s cubic-bezier(.3,1.6,.5,1), top .25s cubic-bezier(.3,1.6,.5,1);
  }
  .btn::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1px solid rgba(74,64,57,.2); }
  .btn .jp { font-family: "Shippori Mincho", serif; font-size: 12px; color: rgba(74,64,57,.6); letter-spacing: 1px; }
  .btn .ko { font-size: 19px; font-weight: 700; }
  .btn:active { transform: scale(.94); }
  .btn.start { background: var(--matcha); }
  .btn.lap { background: var(--kinari); }
  .btn.reset { background: #e6e1d8; }
  .btn.stop { background: var(--sakura); }
  .btn.stop.fleeing { position: fixed; z-index: 50; }
  .btn.stop.tired { animation: pant .5s ease-in-out infinite; }
  @keyframes pant { 50% { transform: scale(.94) rotate(-4deg); } }

  /* 랩 = 기차표 */
  .laps { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
  .ticket {
    display: flex; align-items: stretch; background: var(--card); box-shadow: 0 3px 10px rgba(74,64,57,.08);
    animation: slide .35s cubic-bezier(.3,1.4,.5,1);
  }
  .ticket .stub {
    width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--ai); color: #f6f1e7; font-family: "Shippori Mincho", serif; font-size: 12px;
    border-right: 2px dashed var(--washi);
  }
  .ticket .stub b { font-size: 20px; }
  .ticket .body { flex: 1; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
  .ticket .t { font-family: "Shippori Mincho", serif; font-size: 24px; font-variant-numeric: tabular-nums; }
  .ticket .tag { font-size: 13px; color: var(--soft); }
  .ticket.best .stub { background: var(--matcha-deep); }
  .ticket.worst .stub { background: var(--sakura-deep); }
  @keyframes slide { from { opacity: 0; transform: translateX(-16px); } }

  .hint { text-align: center; color: var(--soft); font-size: 13px; margin-top: 28px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 100;
    background: var(--card); padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow);
    font-size: 16px; opacity: 0; transition: .25s; pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 모달 = 오미쿠지 */
  .scrim {
    position: fixed; inset: 0; background: rgba(74,64,57,.28); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 80;
  }
  .scrim.open { display: flex; }
  .modal {
    width: 100%; max-width: 330px; background: var(--card); padding: 26px 22px 22px; text-align: center;
    position: relative; box-shadow: var(--shadow); border-top: 6px solid var(--shu);
    animation: pop .3s cubic-bezier(.3,1.6,.5,1);
  }
  @keyframes pop { from { transform: scale(.85) rotate(-3deg); opacity: 0; } }
  .modal .kicker { font-family: "Shippori Mincho", serif; color: var(--shu); font-size: 13px; letter-spacing: 4px; }
  .modal h2 { font-family: "Klee One", "Gowun Dodum", cursive; font-size: 25px; margin: 6px 0 8px; font-weight: 600; }
  .modal p { margin: 0 0 20px; color: var(--soft); font-size: 14px; line-height: 1.6; }
  .choices { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .choices.swap { flex-direction: column-reverse; }
  .pill { border: none; cursor: pointer; font-family: inherit; border-radius: 999px; color: var(--ink); transition: transform .12s; }
  .pill:active { transform: scale(.96); }
  .pill.big { width: 100%; background: var(--matcha); font-size: 18px; font-weight: 700; padding: 14px; }
  .pill.tiny { background: none; font-size: 12px; color: var(--soft); text-decoration: underline; padding: 4px; }
  .hold {
    position: relative; width: 100%; height: 58px; border: none; border-radius: 999px; overflow: hidden;
    background: #efe6da; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: inherit; font-size: 17px; font-weight: 700; color: var(--ink);
  }
  .hold .fill { position: absolute; inset: 0; width: 0%; background: var(--sakura); }
  .hold span { position: relative; }
  .later { margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .petals { display: none; }
  }
</style>
</head>
<body>
<div class="petals" id="petals"></div>

<div class="wrap">
  <div class="vert">今日も、ゆっくり。</div>
  <div class="head">
    <div class="en">ひとやすみ · TIMER</div>
    <h1>오늘의 시간 ☕︎</h1>
    <div class="sub">천천히, 그래도 꾸준히</div>
  </div>

  <div class="photo-card">
    <div class="tape"></div><div class="tape r"></div>
    <div class="photo">
      <div class="time" id="time">00:00<span class="cs">.00</span></div>
      <div class="status" id="status">はじめよっか? 🍡</div>
    </div>
    <div class="caption" id="caption">kyoto, slow afternoon</div>
    <div class="hanko">時</div>
  </div>

  <div class="controls" id="controls"></div>
  <div class="laps" id="laps"></div>
  <div class="hint">space · 시작 &nbsp;/&nbsp; L · 랩</div>
</div>

<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script>
  const $ = id => document.getElementById(id);
  const timeEl = $('time'), statusEl = $('status'), controls = $('controls'), lapsEl = $('laps'),
        toastEl = $('toast'), scrim = $('scrim'), modal = $('modal');

  let running = false, startAt = 0, elapsed = 0, lastLap = 0, laps = [], raf = null;
  let dodges = 0, justDodged = false, tryingSince = null, noCount = 0;
  const MAX_DODGE = 6;

  const dodgeLines = ['だめ〜 🙅‍♀️', '잡아봐요~ 🌸', 'おそい ㅋ', 'おっ、제법인데?', 'あと少し… 🍡', 'はぁ… 잡혔다 🍵'];
  const runLines = ['いい感じ ✨ 지금 너무 좋아', '오늘의 나, えらい 🌿', '시간아 ゆっくり 가줘', '멈추지 마… おねがい 🥺', '벚꽃처럼 흘러가는 중 🌸'];

  const pad = n => String(n).padStart(2, '0');
  function fmt(ms) {
    const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60,
          s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
    return { main: (h ? h + ':' : '') + pad(m) + ':' + pad(s), cs: '.' + pad(cs) };
  }
  const now = () => running ? elapsed + performance.now() - startAt : elapsed;

  function tick() {
    const t = fmt(now());
    timeEl.innerHTML = t.main + '<span class="cs">' + t.cs + '</span>';
    if (tryingSince !== null) {
      const sec = Math.floor((performance.now() - tryingSince) / 1000);
      statusEl.textContent = sec > 0 ? `멈추려고 한 지 ${sec}초째 ㅋ` : 'え、멈추게? 😗';
    }
    if (running) raf = requestAnimationFrame(tick);
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  function btn(cls, jp, ko, onClick) {
    const b = document.createElement('button');
    b.className = 'btn ' + cls;
    b.innerHTML = `<span class="jp">${jp}</span><span class="ko">${ko}</span>`;
    if (onClick) b.addEventListener('click', onClick);
    controls.appendChild(b);
    return b;
  }

  function renderControls() {
    controls.innerHTML = '';
    if (running) {
      btn('lap', 'きろく', '랩', addLap);
      makeStop();
    } else {
      btn('start', elapsed ? 'つづき' : 'はじめ', elapsed ? '계속' : '시작', start);
      if (elapsed) btn('reset', 'けす', '지우기', reset);
    }
  }

  // ---- 도망가는 멈춤 버튼 ----
  function makeStop() {
    const b = btn('stop', 'とめる', '멈추기');
    const flee = e => {
      if (dodges >= MAX_DODGE) return;
      e.preventDefault();
      dodges++; justDodged = true;
      setTimeout(() => justDodged = false, 450);
      const s = 92, m = 16;
      if (!b.classList.contains('fleeing')) {
        const r = b.getBoundingClientRect();
        b.style.left = r.left + 'px'; b.style.top = r.top + 'px';
        b.classList.add('fleeing'); void b.offsetWidth;
      }
      b.style.left = (m + Math.random() * (innerWidth - s - m * 2)) + 'px';
      b.style.top = (m + Math.random() * (innerHeight - s - m * 2)) + 'px';
      toast(dodgeLines[dodges - 1]);
      if (dodges >= MAX_DODGE) {
        b.classList.add('tired');
        b.querySelector('.jp').textContent = 'はぁはぁ';
      }
    };
    b.addEventListener('mouseenter', flee);
    b.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') flee(e); });
    b.addEventListener('click', () => { if (dodges >= MAX_DODGE && !justDodged) openAsk(); });
  }

  function start() {
    running = true; startAt = performance.now(); dodges = 0; noCount = 0;
    statusEl.textContent = runLines[Math.floor(Math.random() * runLines.length)];
    $('caption').textContent = 'kyoto, slow afternoon';
    renderControls(); tick();
  }

  function reallyStop() {
    elapsed += performance.now() - startAt;
    running = false; cancelAnimationFrame(raf); tryingSince = null;
    closeModal();
    statusEl.textContent = '…しょうがないな. 멈췄어 😒';
    $('caption').textContent = '결국 멈췄구나 · さみしい';
    renderControls(); tick();
  }

  function reset() {
    elapsed = 0; lastLap = 0; laps = []; lapsEl.innerHTML = '';
    statusEl.textContent = 'もう一回? 새로 시작 🍵';
    $('caption').textContent = 'kyoto, slow afternoon';
    renderControls(); tick();
  }

  function addLap() {
    const total = now();
    laps.push(total - lastLap); lastLap = total;
    const min = Math.min(...laps), max = Math.max(...laps);
    lapsEl.innerHTML = '';
    laps.map((v, i) => ({ v, i })).reverse().forEach(({ v, i }) => {
      const t = fmt(v), d = document.createElement('div');
      let cls = '', tag = '';
      if (laps.length > 1 && v === min) { cls = 'best'; tag = 'はやい 🌸'; }
      else if (laps.length > 1 && v === max) { cls = 'worst'; tag = 'のんびり 🐢'; }
      d.className = 'ticket ' + cls;
      d.innerHTML = `<div class="stub">No.<b>${pad(i + 1)}</b></div>
        <div class="body"><span class="t">${t.main}${t.cs}</span><span class="tag">${tag}</span></div>`;
      lapsEl.appendChild(d);
    });
  }

  // ---- 확인 1 ----
  const asks = [
    ['ほんとに? 🥺', '진짜 멈출 거야?<br>지금 흐름 너무 좋은데…'],
    ['もう一回 考えて 🫠', '버튼 위치 바뀐 거 아님<br>기분 탓임'],
    ['気が変わったでしょ? 🌸', '아직 늦지 않았어'],
  ];
  function openAsk() {
    tryingSince = tryingSince ?? performance.now();
    scrim.classList.add('open'); renderAsk();
  }
  function renderAsk() {
    const [h, p] = asks[Math.min(noCount, asks.length - 1)];
    modal.innerHTML = `
      <div class="kicker">おみくじ · 第${noCount + 1}番</div>
      <h2>${h}</h2><p>${p}</p>
      <div class="choices ${noCount % 2 ? 'swap' : ''}">
        <button class="pill big" id="keep">아니 계속할래 🍡</button>
        <button class="pill tiny" id="yes">응 멈출래</button>
      </div>`;
    $('keep').onclick = keepGoing;
    $('yes').onclick = () => { noCount++; noCount < asks.length ? renderAsk() : renderHold(); };
  }

  // ---- 확인 2: 꾹 누르기 ----
  function renderHold() {
    modal.innerHTML = `
      <div class="kicker">さいごの おねがい</div>
      <h2>꾹 눌러서 도장 찍기 🔴</h2>
      <p>진심이면 3초 동안 꾹 눌러<br>손 떼면 처음부터야 ㅎ</p>
      <button class="hold" id="hold"><div class="fill" id="fill"></div><span id="holdTxt">꾹 눌러서 멈추기</span></button>
      <div class="later"><button class="pill tiny" id="keep">やっぱり 계속할게</button></div>`;
    $('keep').onclick = keepGoing;
    const hold = $('hold'), fill = $('fill'), txt = $('holdTxt');
    const msgs = ['꾹 눌러서 멈추기', 'まだまだ~', '조금만 더…', 'ほんとに?? 😳', '진짜로???'];
    const DUR = 3000; let t0 = null, hr = null, fails = 0;
    const step = () => {
      const p = Math.min(1, (performance.now() - t0) / DUR);
      fill.style.width = (p * 100) + '%';
      txt.textContent = msgs[Math.min(msgs.length - 1, 1 + Math.floor(p * (msgs.length - 1)))];
      if (p >= 1) return reallyStop();
      hr = requestAnimationFrame(step);
    };
    hold.addEventListener('pointerdown', e => { e.preventDefault(); hold.setPointerCapture?.(e.pointerId); t0 = performance.now(); step(); });
    const up = () => {
      if (t0 === null) return;
      cancelAnimationFrame(hr); t0 = null; fill.style.width = '0%'; fails++;
      txt.textContent = fails > 2 ? 'がんばれ~ 손가락 힘 내 ㅋㅋ' : '놓쳤다 ㅋ ざんねん~';
    };
    hold.addEventListener('pointerup', up);
    hold.addEventListener('pointercancel', up);
    hold.addEventListener('contextmenu', e => e.preventDefault());
  }

  function keepGoing() {
    closeModal(); tryingSince = null; noCount = 0;
    statusEl.textContent = 'やっぱりね 😌 그럴 줄 알았어';
    toast('えらい! 현명한 선택 🌷');
  }
  function closeModal() { scrim.classList.remove('open'); modal.innerHTML = ''; }

  document.addEventListener('keydown', e => {
    if (scrim.classList.contains('open')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      running ? toast('키보드 꼼수 だめ~ 🙊') : start();
    } else if ((e.key === 'l' || e.key === 'L') && running) addLap();
  });

  // ---- 벚꽃잎 ----
  const petals = $('petals');
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 8 + Math.random() * 8;
    p.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size * .8}px;` +
      `animation-duration:${9 + Math.random() * 10}s;animation-delay:${-Math.random() * 18}s;` +
      `--drift:${(Math.random() * 160 - 80).toFixed(0)}px;opacity:${.45 + Math.random() * .45}`;
    petals.appendChild(p);
  }

  renderControls();
</script>
</body>
</html>
